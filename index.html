<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my evil input</title>
<style>
  /* Everything you make goes inside #stage: exactly 800 × 400 pixels. The gallery shows
     this box (shrunk to fit), so anything outside it won't be seen. */
  html, body { margin: 0; background: #292b47; color: #eceae3; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #stage {
    width: 800px; height: 400px; overflow: hidden; position: relative;
    display: grid; place-items: center; text-align: center;
    background: #000;
  }

  /* ---- the example below: delete it and build your own ---- */
  /* Prevent text and images from being selected */
  #stage {
    user-select: none;
    -webkit-user-select: none;
  }

  /* Make the cursor a pointer over the stage */
  #stage {
    cursor: pointer;
  }

  /* Prevent image dragging */
  #stage img {
    -webkit-user-drag: none;
    user-drag: none;
  }

  .counter {
    font-size: 48px; /* Change this value */
    font-weight: bold;
    margin-top: 4px;
    color: #eceae3;
  }

</style>
</head>
<body>
<audio id="clickSound" src="clickSound.mp3" preload="auto"></audio>
<div id="stage">
  <!-- example evil input: volume you have to pump up by hand, and it leaks back down -->
  <div class="content">
    <h1>TEMMIE FLAKES</h1>
    <p>CLICK FOR TEMMIE FLAKES!1!11!1!</p>
    <img src="Temmie_battle_idle.webp" alt="Animation" class="center-gif">
    <div class="counter" id="counter">0</div>
  </div>
</div>
<script>
  // the example: delete this too
  let count = 0;

  document.addEventListener("click", () => {
    count++;

    document.getElementById("counter").textContent = count;

    const sound = document.getElementById("clickSound");
    sound.currentTime = 0;
    sound.play();
  });
</script>
</body>
</html>
